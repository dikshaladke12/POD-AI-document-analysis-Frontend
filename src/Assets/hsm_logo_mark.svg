    <path d="M146 28v36a16 16 0 0 0 16 16h36" fill="#EEF2FF"/>
    <path d="M146 28l56 56h-40a16 16 0 0 1-16-16V28z" fill="#DBEAFE"/>
  </g>

  <!-- Two-pane split -->
  <path d="M88 96v96" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>
  <rect x="72" y="96" width="112" height="96" rx="10" stroke="#111827" stroke-width="4" fill="none"/>
  <!-- Left pane: blocks (tables/images) -->
  <rect x="80" y="108" width="20" height="16" rx="3" fill="#0B5FFF"/>
  <rect x="80" y="132" width="20" height="16" rx="3" fill="#60A5FA"/>
  <rect x="80" y="156" width="20" height="16" rx="3" fill="#93C5FD"/>
  <!-- Right pane: text lines -->
  <rect x="108" y="110" width="64" height="8" rx="4" fill="#111827" opacity="0.9"/>
  <rect x="108" y="128" width="72" height="8" rx="4" fill="#111827" opacity="0.8"/>
  <rect x="108" y="146" width="56" height="8" rx="4" fill="#111827" opacity="0.7"/>
  <rect x="108" y="164" width="68" height="8" rx="4" fill="#111827" opacity="0.7"/>

  <!-- AI spark (discovery) -->
  <g transform="translate(172,78)">
    <circle cx="0" cy="0" r="12" fill="url(#g1)" opacity="0.9"/>
    <path d="M0 -18 L0 -10 M0 10 L0 18 M-18 0 L-10 0 M10 0 L18 0
             M-13 -13 L-8 -8 M8 8 L13 13 M13 -13 L8 -8 M-13 13 L-8 8"
          stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Validation check (rules/mismatch resolution) -->
  <path d="M96 196l16 16 40-40" fill="none" stroke="#22C55E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle border -->
  <rect x="44" y="20" width="168" height="216" rx="24" stroke="#F3F4F6" stroke-width="2" fill="none"/>
  <title>HSM Internal Tool — Mark</title>
</svg>
