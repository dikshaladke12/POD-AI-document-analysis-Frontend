<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shape: rounded square document with folded corner -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B5FFF"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Document container -->
  <g filter="url(#shadow)">
    <path d="M64 28h82a8 8 0 0 1 5.66 2.34l44 44A8 8 0 0 1 198 80v128a20 20 0 0 1-20 20H64a20 20 0 0 1-20-20V48a20 20 0 0 1 20-20z"
          fill="white" stroke="#E5E7EB" stroke-width="2"/>
